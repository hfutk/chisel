name: CI
on:
  pull_request: {}
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # ================
  # SPELLING CHECK
  # ================
  codespell:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: codespell
        uses: codespell-project/actions-codespell@v2

  # ================
  # BUILD AND TEST JOB
  # ================
  test:
    name: Build & Test
    strategy:
      matrix:
        go-version: ["stable"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build
        run: go build -v -o /dev/null .
      - name: Test
        run: go test -v ./...

  # ================
  # RELEASE (no Docker — binaries only)
  # ================
  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Run GoReleaser (binaries only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=docker --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive integrity
        run: |
          set -euo pipefail
          bad=0
          for f in dist/*.gz dist/*.zip; do
            [ -e "$f" ] || continue
            case "$f" in
              *.gz)  gzip -t "$f" || { echo "CORRUPT: $f"; bad=1; } ;;
              *.zip) unzip -t "$f" >/dev/null || { echo "CORRUPT: $f"; bad=1; } ;;
            esac
          done
          [ "$bad" = 0 ] && echo "all archives verified"
          exit "$bad"
