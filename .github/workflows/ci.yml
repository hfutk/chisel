name: CI
on:
  pull_request: {}
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # ================
  # SPELLING CHECK
  # ================
  codespell:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: codespell
        uses: codespell-project/actions-codespell@v2

  # ================
  # BUILD AND TEST JOB
  # ================
  test:
    name: Build & Test
    strategy:
      matrix:
        go-version: ["stable"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build
        run: go build -v -o /dev/null .
      - name: Test
        run: go test -v ./...

  # ================
  # BUILD & RELEASE (garble + artifact + optional release)
  # ================
  build-and-release:
    name: Build & Release
    needs: test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for release
      actions: read      # needed for artifact upload
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify garble
        run: garble version

      - name: Prepare build output directory
        run: |
          rm -rf /tmp/build-output
          mkdir -p /tmp/build-output

      - name: Build with garble (all platforms)
        env:
          CGO_ENABLED: 0
          LDFLAGS: "-s -w -X github.com/jpillora/chisel/share.BuildVersion=${{ github.ref_name }}"
        run: |
          cat << 'EOF' > /tmp/platforms.txt
          linux|386||
          linux|amd64||
          linux|arm|5|
          linux|arm|6|
          linux|arm|7|
          linux|arm64||
          linux|ppc64||
          linux|ppc64le||
          linux|mips||hardfloat
          linux|mips||softfloat
          linux|mipsle||hardfloat
          linux|mipsle||softfloat
          linux|mips64||hardfloat
          linux|mips64||softfloat
          linux|mips64le||hardfloat
          linux|mips64le||softfloat
          linux|s390x||
          darwin|amd64||
          darwin|arm64||
          windows|386||
          windows|amd64||
          windows|arm64||
          openbsd|386||
          openbsd|amd64||
          openbsd|arm||
          openbsd|arm64||
          EOF

          while IFS='|' read -r GOOS GOARCH GOARM GOMIPS; do
            [[ -z "$GOOS" || "$GOOS" == \#* ]] && continue

            SUFFIX=""
            [ -n "$GOARM" ] && SUFFIX="${SUFFIX}v${GOARM}"
            [ -n "$GOMIPS" ] && SUFFIX="${SUFFIX}_${GOMIPS}"

            BINARY_NAME="chisel_${GOOS}_${GOARCH}${SUFFIX}"
            OUTPUT="/tmp/build-output/${BINARY_NAME}"
            [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"

            echo "--> Building $GOOS/$GOARCH (arm=$GOARM, mips=$GOMIPS)"
            export GOOS GOARCH GOARM GOMIPS
            garble -tiny build \
              -trimpath \
              -ldflags="$LDFLAGS" \
              -o "$OUTPUT" \
              . || echo "WARNING: Build failed for $GOOS/$GOARCH, continuing..."
          done < /tmp/platforms.txt

          rm -f /tmp/platforms.txt
          ls -la /tmp/build-output/

          # 确保至少有一个二进制生成
          if [ -z "$(ls -A /tmp/build-output/)" ]; then
            echo "ERROR: No binaries were built!"
            exit 1
          fi

      # 上传二进制文件为 artifact（master 和 tag 上均可下载）
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chisel-binaries
          path: /tmp/build-output/*
          retention-days: 30

      # 仅当推送 tag 时才执行 GoReleaser 发布
      - name: Run GoReleaser (only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive integrity
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          bad=0
          for f in dist/*.gz dist/*.zip; do
            [ -e "$f" ] || continue
            case "$f" in
              *.gz)  gzip -t "$f" || { echo "CORRUPT: $f"; bad=1; } ;;
              *.zip) unzip -t "$f" >/dev/null || { echo "CORRUPT: $f"; bad=1; } ;;
            esac
          done
          [ "$bad" = 0 ] && echo "all archives verified"
          exit "$bad"
