name: CI
on:
  pull_request: {}
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # ================
  # SPELLING CHECK
  # ================
  codespell:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: codespell
        uses: codespell-project/actions-codespell@v2

  # ================
  # BUILD AND TEST JOB
  # ================
  test:
    name: Build & Test
    strategy:
      matrix:
        go-version: ["stable"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build
        run: go build -v -o /dev/null .
      - name: Test
        run: go test -v ./...

  # ================
  # BUILD & RELEASE (garble + artifact + optional release)
  # ================
  build-and-release:
    name: Build & Release
    needs: test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for release
      actions: read      # needed for artifact upload
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify garble
        run: garble version

      - name: Prepare build output directory
        run: |
          rm -rf /tmp/build-output
          mkdir -p /tmp/build-output

      - name: Build with garble (all platforms)
        env:
          CGO_ENABLED: 0
          LDFLAGS: "-s -w -X github.com/jpillora/chisel/share.BuildVersion=${{ github.ref_name }}"
        run: |
          cat << 'EOF' > /tmp/platforms.txt
          linux|386||
          linux|amd64||
          linux|arm|5|
          linux|arm|6|
          linux|arm|7|
          linux|arm64||
          linux|ppc64||
          linux|ppc64le||
          linux|mips||hardfloat
          linux|mips||softfloat
          linux|mipsle||hardfloat
          linux|mipsle||softfloat
          linux|mips64||hardfloat
          linux|mips64||softfloat
          linux|mips64le||hardfloat
          linux|mips64le||softfloat
          linux|s390x||
          darwin|amd64||
          darwin|arm64||
          windows|386||
          windows|amd64||
          windows|arm64||
          openbsd|386||
          openbsd|amd64||
          openbsd|arm||
          openbsd|arm64||
          EOF

          while IFS='|' read -r GOOS GOARCH GOARM GOMIPS; do
            [[ -z "$GOOS" || "$GOOS" == \#* ]] && continue

            SUFFIX=""
            [ -n "$GOARM" ] && SUFFIX="${SUFFIX}v${GOARM}"
            [ -n "$GOMIPS" ] && SUFFIX="${SUFFIX}_${GOMIPS}"

            BINARY_NAME="chisel_${GOOS}_${GOARCH}${SUFFIX}"
            OUTPUT="/tmp/build-output/${BINARY_NAME}"
            [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"

            echo "--> Building $GOOS/$GOARCH (arm=$GOARM, mips=$GOMIPS)"
            export GOOS GOARCH GOARM GOMIPS
            garble -tiny build \
              -trimpath \
              -ldflags="$LDFLAGS" \
              -o "$OUTPUT" \
              . || echo "WARNING: Build failed for $GOOS/$GOARCH, continuing..."
          done < /tmp/platforms.txt

          rm -f /tmp/platforms.txt
          ls -la /tmp/build-output/

          # 确保至少有一个二进制生成
          if [ -z "$(ls -A /tmp/build-output/)" ]; then
            echo "ERROR: No binaries were built!"
            exit 1
          fi

      # 上传二进制文件为 artifact（master 和 tag 上均可下载）
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chisel-binaries
          path: /tmp/build-output/*
          retention-days: 30

      # 仅当推送 tag 时才打包并发布 GitHub Release
      # 说明：此前使用 GoReleaser（--clean + before 钩子拷贝预编译产物），
      # 钩子在 goreleaser 清空 dist 后又重新填充 dist，导致
      # "dist is not empty" 校验失败。现改为 shell 打包
      # （与上游 jpillora/chisel 发布风格一致：unix .gz / windows .zip）
      # + checksums.txt + 完整性校验 + gh CLI 创建/更新 Release，简单稳定。
      - name: Package release archives (only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          rm -rf dist
          mkdir -p dist
          shopt -s nullglob
          cd /tmp/build-output
          for f in *; do
            base="${f%.exe}"
            base="${base#chisel_}"
            case "$f" in
              *.exe)
                echo "--> Packing ${base}.zip"
                zip -q -j "${GITHUB_WORKSPACE}/dist/chisel_${VERSION}_${base}.zip" "$f"
                ;;
              *)
                name="${f#chisel_}"
                echo "--> Packing ${name}.gz"
                gzip -c "$f" > "${GITHUB_WORKSPACE}/dist/chisel_${VERSION}_${name}.gz"
                ;;
            esac
          done
          cd "${GITHUB_WORKSPACE}/dist"
          archives=(*.gz *.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "ERROR: no archives were produced!"
            exit 1
          fi
          echo "--> Generating checksums.txt (${#archives[@]} archives)"
          sha256sum "${archives[@]}" > checksums.txt
          ls -la

      - name: Verify archive integrity (only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          bad=0
          shopt -s nullglob
          for f in dist/*.gz dist/*.zip; do
            case "$f" in
              *.gz)  gzip -t "$f" || { echo "CORRUPT: $f"; bad=1; } ;;
              *.zip) unzip -t "$f" >/dev/null || { echo "CORRUPT: $f"; bad=1; } ;;
            esac
          done
          if [ "$bad" = 0 ]; then
            echo "all archives verified"
          fi
          exit "$bad"

      - name: Create GitHub Release and upload assets (only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists, uploading assets with --clobber"
            gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
          echo "Release URL: $(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json url -q .url)"
