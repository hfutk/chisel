name: CI
on:
  pull_request: {}
  push:
    branches: [master]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # ================
  # SPELLING CHECK
  # ================
  codespell:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: codespell
        uses: codespell-project/actions-codespell@v2

  # ================
  # BUILD AND TEST JOB
  # ================
  test:
    name: Build & Test
    strategy:
      matrix:
        go-version: ["stable"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build
        run: go build -v -o /dev/null .
      - name: Test
        run: go test -v ./...

  # ================
  # RELEASE (garble build + GoReleaser packaging)
  # ================
  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for creating GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify garble
        run: garble version

      # 手动清理并创建 dist 目录
      - name: Prepare dist directory
        run: |
          rm -rf dist
          mkdir -p dist

      # 手动用 garble 交叉编译所有平台
      - name: Build with garble (all platforms)
        env:
          CGO_ENABLED: 0
          LDFLAGS: "-s -w -X github.com/jpillora/chisel/share.BuildVersion=${{ github.ref_name }}"
        run: |
          # 定义完整的平台列表 (GOOS|GOARCH|GOARM|GOMIPS)
          cat << 'EOF' > platforms.txt
          linux|386||
          linux|amd64||
          linux|arm|5|
          linux|arm|6|
          linux|arm|7|
          linux|arm64||
          linux|ppc64||
          linux|ppc64le||
          linux|mips||hardfloat
          linux|mips||softfloat
          linux|mipsle||hardfloat
          linux|mipsle||softfloat
          linux|mips64||hardfloat
          linux|mips64||softfloat
          linux|mips64le||hardfloat
          linux|mips64le||softfloat
          linux|s390x||
          darwin|amd64||
          darwin|arm64||
          windows|386||
          windows|amd64||
          windows|arm64||
          openbsd|386||
          openbsd|amd64||
          openbsd|arm||
          openbsd|arm64||
          EOF

          while IFS='|' read -r GOOS GOARCH GOARM GOMIPS; do
            [[ -z "$GOOS" || "$GOOS" == \#* ]] && continue

            SUFFIX=""
            [ -n "$GOARM" ] && SUFFIX="${SUFFIX}v${GOARM}"
            [ -n "$GOMIPS" ] && SUFFIX="${SUFFIX}_${GOMIPS}"

            BINARY_NAME="chisel_${GOOS}_${GOARCH}${SUFFIX}"
            OUTPUT="dist/${BINARY_NAME}"
            [ "$GOOS" = "windows" ] && OUTPUT="${OUTPUT}.exe"

            echo "--> Building $GOOS/$GOARCH (arm=$GOARM, mips=$GOMIPS)"
            export GOOS GOARCH GOARM GOMIPS
            garble -tiny build \
              -trimpath \
              -ldflags="$LDFLAGS" \
              -o "$OUTPUT" \
              .
          done < platforms.txt

          # 清理临时文件
          rm -f platforms.txt

          # 展示构建产物
          ls -la dist/

      # 运行 GoReleaser（不加 --clean，因为 dist/ 已经是准备好的）
      - name: Run GoReleaser (pack & release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive integrity
        run: |
          set -euo pipefail
          bad=0
          for f in dist/*.gz dist/*.zip; do
            [ -e "$f" ] || continue
            case "$f" in
              *.gz)  gzip -t "$f" || { echo "CORRUPT: $f"; bad=1; } ;;
              *.zip) unzip -t "$f" >/dev/null || { echo "CORRUPT: $f"; bad=1; } ;;
            esac
          done
          [ "$bad" = 0 ] && echo "all archives verified"
          exit "$bad"
