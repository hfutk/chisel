# GoReleaser v2 configuration
# 构建由 CI 手动完成（garble），此处只负责打包和发布
version: 2

# 在构建步骤前将 garble 预编译的二进制复制到 dist/
before:
  hooks:
    - cp -r build-output/* dist/

builds:
  - id: chisel
    skip: true
    # 二进制文件名模板（与 garble 输出的名称严格一致）
    binary: >-
      chisel_{{ .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Mips }}_{{ .Mips }}{{ end }}

nfpms:
  - maintainer: "https://github.com/jpillora"
    formats:
      - deb
      - rpm
      - apk
    # 包文件名模板（与二进制名同步）
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"

archives:
  - formats:
      - gz
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
