# GoReleaser v2 configuration
# 构建由 CI 手动完成（garble），此处只负责打包和发布
version: 2

# 关闭默认构建，因为二进制已由 CI 生成到 dist/
builds:
  - id: chisel
    skip: true
    # 告诉 GoReleaser 如何找到编译好的二进制文件
    binary: >-
      chisel_{{ .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
      {{- if .Mips }}_{{ .Mips }}{{ end }}

# 系统包：deb, rpm, apk
nfpms:
  - maintainer: "https://github.com/jpillora"
    formats:
      - deb
      - rpm
      - apk
    # 包内的二进制文件名保持一致
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"
    builds:
      - chisel

# 归档：.tar.gz / .zip
archives:
  - formats:
      - gz
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*
    # 告诉归档器使用哪个 build 定义
    builds:
      - chisel

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# 不再包含任何 Docker 相关内容
